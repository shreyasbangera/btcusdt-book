# Twice-daily decision for the BTCUSDT book, on GitHub's runners.
#
# SCHEDULES ONLY FIRE FROM THE DEFAULT BRANCH. GitHub ignores `schedule:` on any
# other branch, so this file has to be on `main` before it runs on its own. Until
# then use the "Run workflow" button, which works from any branch.
#
# BEST-EFFORT TIMING. Scheduled workflows are commonly delayed 10-30 minutes
# under load and are sometimes skipped entirely. The backtest assumes a fill at
# the next bar's open, so a late run is a worse fill and a skipped run is a
# decision the backtest never missed. Survivable for a 12h book; still the reason
# a $4 VPS is better for anything you mind losing.
name: BTCUSDT book

on:
  schedule:
    - cron: "5 0 * * *"      # 00:05 UTC, just after the 12h bar closes
    - cron: "5 12 * * *"     # 12:05 UTC
  workflow_dispatch:
    inputs:
      arm:
        description: "Place orders (otherwise this is a dry run)"
        type: boolean
        default: false
      risk:
        description: "Total risk budget per decision"
        default: "0.08"

concurrency:
  group: btcusdt-book        # never let two decisions overlap
  cancel-in-progress: false

permissions:
  contents: write   # to publish status/latest.json

jobs:
  decide:
    # Switch runners without editing this file: set a repository variable
    # RUNNER_LABEL to "self-hosted" (Settings -> Secrets and variables ->
    # Actions -> Variables). GitHub's own runners are refused by Binance, so a
    # machine in a served location is the only way this bot can actually trade.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      BOOK_STORE: ${{ github.workspace }}/data/live
      PYTHONPATH: ${{ github.workspace }}
      BOT_MODE: test                      # testnet. Never 'live' from CI.
      BOT_STRATEGY: v7
      BOT_EQUITY: "10000"
      BOT_RISK: ${{ github.event.inputs.risk || '0.08' }}
      BINANCE_TEST_KEY: ${{ secrets.BINANCE_TEST_KEY }}
      BINANCE_TEST_SECRET: ${{ secrets.BINANCE_TEST_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements-research.txt   # the runner also re-selects

      - name: Preflight
        # Import everything the run needs BEFORE the expensive steps. A missing
        # dependency used to surface after a 15-minute data seed; here it fails
        # in seconds and names itself.
        run: |
          python - <<'EOF'
          import importlib
          for m in ("pandas", "numpy", "pyarrow", "numba", "panelstore",
                    "engine.core", "research.harness", "live.runner",
                    "live.fetch", "strategies.s87_combined", "webapp.once"):
              importlib.import_module(m)
              print(f"  ok  {m}")
          print("preflight passed")
          EOF

      - name: The bot still runs without numba or pyarrow
        # Where this bot can live is decided by its dependency list, and one
        # stray import at the top of a module the decision path touches would
        # take away every small machine it can run on - silently, until
        # deployment. Four seconds here keeps that honest.
        run: python tests/no_heavy_deps.py

      # The panels are under a megabyte and change every run, so the cache key is
      # unique (always a miss, always a save) and restore-keys picks up the most
      # recent. A cold cache falls back to a full seed, which is slow but works.
      - name: Restore market-data panels
        uses: actions/cache@v4
        with:
          path: data/live
          key: panels-${{ github.run_id }}
          restore-keys: panels-

      - name: Top up market data
        run: python live/fetch.py update || python live/fetch.py seed --months 36

      - name: Install the quarterly plan
        # The SELECTION cannot run here. It ranks 200 configurations by
        # backtesting each over the trailing year, which needs the research data
        # cache - about 1.7 GB of parquet that is not in this repository and is
        # not worth rebuilding twice a day. So the chosen plan is committed under
        # plans/ and simply installed. Re-selecting is a quarterly local step;
        # see webapp/ACTIONS.md.
        run: |
          mkdir -p "$BOOK_STORE"
          if [ ! -f "$BOOK_STORE/v7_plan.json" ]; then
            cp plans/v7_plan.json "$BOOK_STORE/v7_plan.json"
            echo "installed the committed plan:"
          else
            echo "plan already present:"
          fi
          python -c "import json;p=json.load(open('$BOOK_STORE/v7_plan.json'));print('  as of',p['asof'],'-',len(p['configs']),'configurations');[print('   ',c) for c in p['configs']]"

      - name: Decide
        run: |
          ARM=""
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event.inputs.arm }}" = "true" ]; then ARM="--arm"; fi
          echo "running with ARM='${ARM:-dry run}'"
          python -m webapp.once --strategy "$BOT_STRATEGY" \
            --equity "$BOT_EQUITY" --risk "$BOT_RISK" $ARM | tee run.txt

      - name: Keep the plan as a record
        if: always()
        run: python -m webapp.once --strategy "$BOT_STRATEGY" --json > plan.json || true

      - name: Publish the decision for the dashboard
        # The dashboard reads this instead of carrying market-data panels, which
        # is what lets it run on a free tier with no disk.
        # Publishes from the DEFAULT BRANCH on any run, scheduled or manual, so
        # you can press "Run workflow" once after merging and watch the dashboard
        # fill in rather than waiting up to 12 hours for the next schedule. Never
        # publishes from a feature branch, so an experiment cannot overwrite the
        # record the dashboard reads.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          mkdir -p status
          cp plan.json status/latest.json || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/latest.json
          git diff --staged --quiet || git commit -m "status: decision $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-${{ github.run_number }}
          path: |
            run.txt
            plan.json
          retention-days: 90

      - name: Fail loudly if nothing was decided
        # Silence and success look identical in a cron job. This makes a run that
        # produced no decision show up red rather than green.
        run: grep -qE "SENT|not sent" run.txt
