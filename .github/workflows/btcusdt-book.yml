# RETIRED AS A SCHEDULED DECISION PATH - 2026-09-13.
#
# Binance refuses most datacentre ranges, GitHub's runners included, so this
# could not reach the API reliably enough to be trusted with a decision. The
# schedule is REMOVED rather than left to fail twice a day, for two reasons: a
# job that fires and errors is noise in the Actions tab, and a run that half
# succeeds publishes a status file that a dashboard would read as current.
#
# `workflow_dispatch` is kept so the job can still be run by hand for
# diagnostics. It decides nothing on its own and nothing should depend on it.
#
# THE LAPTOP IS NOW THE SOLE DECISION PATH: the hourly task while it is awake,
# and the wake task at 05:35 / 17:35 IST while it sleeps. The only record of
# what actually got decided is `python -m webapp.journal`, and on a laptop that
# is the only thing that will tell you about a bar nobody was there for.
#
# If this is ever revived, it needs a runner on an IP Binance serves, and the
# schedule below - 00:05 and 12:05 UTC, just after each 12h bar closes.
name: BTCUSDT book

on:
  workflow_dispatch:
    inputs:
      arm:
        description: "Place orders (otherwise this is a dry run)"
        type: boolean
        default: false
      risk:
        description: "Total risk budget per decision"
        default: "0.144"

concurrency:
  group: btcusdt-book        # never let two decisions overlap
  cancel-in-progress: false

permissions:
  contents: write   # to publish status/latest.json

jobs:
  decide:
    # Switch runners without editing this file: set a repository variable
    # RUNNER_LABEL to "self-hosted" (Settings -> Secrets and variables ->
    # Actions -> Variables). GitHub's own runners are refused by Binance, so a
    # machine in a served location is the only way this bot can actually trade.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      BOOK_STORE: ${{ github.workspace }}/data/live
      PYTHONPATH: ${{ github.workspace }}
      BOT_MODE: test                      # testnet. Never 'live' from CI.
      BOT_STRATEGY: v7
      BOT_EQUITY: "10000"
      BOT_RISK: ${{ github.event.inputs.risk || '0.08' }}
      BINANCE_TEST_KEY: ${{ secrets.BINANCE_TEST_KEY }}
      BINANCE_TEST_SECRET: ${{ secrets.BINANCE_TEST_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements-research.txt   # the runner also re-selects

      - name: Preflight
        # Import everything the run needs BEFORE the expensive steps. A missing
        # dependency used to surface after a 15-minute data seed; here it fails
        # in seconds and names itself.
        run: |
          python - <<'EOF'
          import importlib
          for m in ("pandas", "numpy", "pyarrow", "numba", "panelstore",
                    "engine.core", "research.harness", "live.runner",
                    "live.fetch", "strategies.s87_combined", "webapp.once"):
              importlib.import_module(m)
              print(f"  ok  {m}")
          print("preflight passed")
          EOF

      - name: Tests
        # Cheap, and they cover the two things that are invisible until they
        # matter: that the bot still runs with neither numba nor pyarrow (which
        # decides what machines it can live on), and that the decision journal's
        # coverage arithmetic is right (which decides whether a laptop's P&L can
        # be believed).
        run: python tests/all.py

      # The panels are under a megabyte and change every run, so the cache key is
      # unique (always a miss, always a save) and restore-keys picks up the most
      # recent. A cold cache falls back to a full seed, which is slow but works.
      - name: Restore market-data panels
        uses: actions/cache@v4
        with:
          path: data/live
          key: panels-${{ github.run_id }}
          restore-keys: panels-

      - name: Top up market data
        run: python live/fetch.py update || python live/fetch.py seed --months 36

      - name: Install the quarterly plan
        # The SELECTION cannot run here. It ranks 200 configurations by
        # backtesting each over the trailing year, which needs the research data
        # cache - about 1.7 GB of parquet that is not in this repository and is
        # not worth rebuilding twice a day. So the chosen plan is committed under
        # plans/ and simply installed. Re-selecting is a quarterly local step;
        # see webapp/ACTIONS.md.
        run: |
          mkdir -p "$BOOK_STORE"
          if [ ! -f "$BOOK_STORE/v7_plan.json" ]; then
            cp plans/v7_plan.json "$BOOK_STORE/v7_plan.json"
            echo "installed the committed plan:"
          else
            echo "plan already present:"
          fi
          python -c "import json;p=json.load(open('$BOOK_STORE/v7_plan.json'));print('  as of',p['asof'],'-',len(p['configs']),'configurations');[print('   ',c) for c in p['configs']]"

      - name: Decide
        run: |
          ARM=""
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event.inputs.arm }}" = "true" ]; then ARM="--arm"; fi
          echo "running with ARM='${ARM:-dry run}'"
          python -m webapp.once --strategy "$BOT_STRATEGY" \
            --equity "$BOT_EQUITY" --risk "$BOT_RISK" $ARM | tee run.txt

      - name: Keep the plan as a record
        if: always()
        run: python -m webapp.once --strategy "$BOT_STRATEGY" --json > plan.json || true

      # The publish step is GONE, with the schedule that justified it.
      #
      # It copied the run's plan to status/latest.json and pushed it, so a
      # dashboard with STATUS_URL set could read the last decision without
      # carrying market-data panels. That made sense while this workflow decided
      # twice a day. It is actively harmful now: the only runs left are manual
      # diagnostics, and publishing one would put a one-off dry run on `main`
      # where a dashboard reads it as the current state of a live book.
      #
      # The decision record lives on the laptop - `python -m webapp.journal`.
      # The run's plan is still attached to the run as an artifact below, which
      # is what a diagnostic actually needs.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-${{ github.run_number }}
          path: |
            run.txt
            plan.json
          retention-days: 90

      - name: Fail loudly if nothing was decided
        # Silence and success look identical in a cron job. This makes a run that
        # produced no decision show up red rather than green.
        run: grep -qE "SENT|not sent" run.txt
